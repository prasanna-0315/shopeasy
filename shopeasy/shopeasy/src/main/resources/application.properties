spring.application.name=shopeasy

# Local MySQL configuration. Set DB_USERNAME and DB_PASSWORD in your terminal.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopeasy}
spring.datasource.username=${DB_USERNAME:shopeasy_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# Development fallback only. Set a long random JWT_SECRET for deployment.
jwt.secret=${JWT_SECRET:ShopEasyLocalDevelopmentSecretKey2026OnlyChangeForProduction}

shopeasy.catalog.seed=${SEED_SAMPLE_PRODUCTS:true}
